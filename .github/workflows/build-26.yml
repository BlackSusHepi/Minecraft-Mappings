name: Build 26.3
on:
  push:
    branches: [ "port-26.3" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDKs (8 for common/buildSrc, 25 for Minecraft 26.x)
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            25
          distribution: temurin
      - name: Let Gradle find the installed JDKs
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
          echo "org.gradle.java.installations.auto-download=false" >> ~/.gradle/gradle.properties
      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build common
        run: gradle -Ptarget26 common:build -x test --stacktrace
      - name: Scan Minecraft classes (dry run)
        run: gradle -Ptarget26 test -x common:test --continue -Pgenerate=dryRun 2>&1 | tee scan.log
        continue-on-error: true
      - name: Generate holders
        run: gradle -Ptarget26 test -x common:test --continue -Pgenerate=normal 2>&1 | tee generate.log
        continue-on-error: true
      - name: Dump Minecraft 26.3 API (class names and signatures)
        if: always()
        run: .github/scripts/dump-mc-api.sh mc-api
        continue-on-error: true
      - name: Publish API dump to branch mc-api-26.3
        if: always()
        run: |
          mkdir /tmp/pub
          cp mc-api/classes.txt mc-api/jar-path.txt mc-api/javap-errors.txt mc-api/where-is.txt /tmp/pub/ || true
          gzip -c mc-api/signatures.txt > /tmp/pub/signatures.txt.gz || true
          tar czf /tmp/pub/holders.tar.gz -C fabric/26.3-mapping/src/main/java/org/mtr/mapping holder || true
          cd /tmp/pub
          git init -q -b mc-api-26.3
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add . && git commit -q -m "Minecraft 26.3 API dump"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mc-api-26.3
        continue-on-error: true
      - name: Build 26.3 mapping jar
        run: gradle -Ptarget26 fabric:26.3-mapping:build -x test 2>&1 | tee build.log
      - name: Upload logs and jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-26.3
          path: |
            *.log
            mc-api/
            build/release/*.jar
