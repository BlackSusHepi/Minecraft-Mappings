name: Build 26.3
on:
  push:
    branches: [ "port-26.3" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build common
        run: gradle -Ptarget26 common:build -x test --stacktrace
      - name: Scan Minecraft classes (dry run)
        run: gradle -Ptarget26 test -x common:test --continue -Pgenerate=dryRun 2>&1 | tee scan.log
        continue-on-error: true
      - name: Generate holders
        run: gradle -Ptarget26 test -x common:test --continue -Pgenerate=normal 2>&1 | tee generate.log
        continue-on-error: true
      - name: Build 26.3 mapping jar
        run: gradle -Ptarget26 fabric:26.3-mapping:build -x test 2>&1 | tee build.log
      - name: Upload logs and jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-26.3
          path: |
            *.log
            build/release/*.jar
