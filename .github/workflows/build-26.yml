name: Build 26.3
on:
  push:
    branches: [ "port-26.3" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDKs (8, 16 and 17 for the old versions, 25 for 26.x)
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
            25
          distribution: temurin
      - name: Let Gradle find the installed JDKs
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
          echo "org.gradle.java.installations.auto-download=true" >> ~/.gradle/gradle.properties
      - name: Setup Gradle 9.8.2 (for 26.x)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2

      # 1. Scan every older Minecraft version (needed to know which methods exist in ALL versions). Same as upstream CI.
      - name: Scan older versions (dry run)
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew test -x common:test --continue -Pgenerate=dryRun 2>&1 | tee scan-old.log
        continue-on-error: true
      # 2. Scan 26.3
      - name: Scan 26.3 (dry run)
        run: JAVA_HOME=$JAVA_HOME_25_X64 gradle -Ptarget26 test -x common:test --continue -Pgenerate=dryRun 2>&1 | tee scan-26.log
        continue-on-error: true
      - name: Dump Minecraft 26.3 API (class names and signatures)
        if: always()
        run: .github/scripts/dump-mc-api.sh mc-api
        continue-on-error: true
      # 3. Generate the 26.3 holders from the combined method list
      - name: Generate 26.3 holders
        run: JAVA_HOME=$JAVA_HOME_25_X64 gradle -Ptarget26 test -x common:test --continue -Pgenerate=normal 2>&1 | tee generate.log
        continue-on-error: true
      - name: Publish dumps to branch mc-api-26.3
        if: always()
        run: |
          mkdir /tmp/pub
          cp mc-api/classes.txt mc-api/jar-path.txt mc-api/javap-errors.txt mc-api/where-is.txt /tmp/pub/ || true
          gzip -c mc-api/signatures.txt > /tmp/pub/signatures.txt.gz || true
          tar czf /tmp/pub/holders.tar.gz -C fabric/26.3-mapping/src/main/java/org/mtr/mapping holder || true
          tar czf /tmp/pub/existingMethods.tar.gz build/existingMethods build/libraryMethods || true
          cd /tmp/pub
          git init -q -b mc-api-26.3
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add . && git commit -q -m "Minecraft 26.3 API dump"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mc-api-26.3
        continue-on-error: true
      - name: Build 26.3 mapping jar
        run: JAVA_HOME=$JAVA_HOME_25_X64 gradle -Ptarget26 common:build fabric:26.3-mapping:build -x test 2>&1 | tee build.log
      - name: Upload logs and jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-26.3
          path: |
            *.log
            build/release/*.jar
