pluginManagement {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.minecraftforge.net/" }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version "+"
}

if (providers.gradleProperty("target26").isPresent()) {
	// Minecraft 26.x needs Gradle 9 + Java 25 + the new Loom plugin, so it is built separately from the older versions
	include("common")
	include("fabric:26.3-mapping")
	include("fabric:26.3-generator")
	project(":fabric").buildFileName = "build-26.gradle"
} else {
	include("common")
	include("fabric:1.16.5-mapping")
	include("fabric:1.17.1-mapping")
	include("fabric:1.18.2-mapping")
	include("fabric:1.19.2-mapping")
	include("fabric:1.19.4-mapping")
	include("fabric:1.20.1-mapping")
	include("fabric:1.20.4-mapping")
	include("forge:1.16.5-mapping")
	include("forge:1.17.1-mapping")
	include("forge:1.18.2-mapping")
	include("forge:1.19.2-mapping")
	include("forge:1.19.4-mapping")
	include("forge:1.20.1-mapping")
	include("forge:1.20.4-mapping")
	include("fabric:1.16.5-generator")
	include("fabric:1.17.1-generator")
	include("fabric:1.18.2-generator")
	include("fabric:1.19.2-generator")
	include("fabric:1.19.4-generator")
	include("fabric:1.20.1-generator")
	include("fabric:1.20.4-generator")
	include("forge:1.16.5-generator")
	include("forge:1.17.1-generator")
	include("forge:1.18.2-generator")
	include("forge:1.19.2-generator")
	include("forge:1.19.4-generator")
	include("forge:1.20.1-generator")
	include("forge:1.20.4-generator")

}

rootProject.name = "Minecraft-Mappings"
